name: Validate Next.js app

on:
  push:
    branches: ["master", "main"]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: script/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: script

      - name: Run server Next.js
        run: npm run dev &
        working-directory: script
      
      - name: Wait for server start
        run: sleep 15

      - name: Verificar se o servidor está rodando
        run: curl -I http://localhost:3000 | grep "200 OK" || exit 1

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: script/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: script

      - name: Build Next.js
        run: npm run build
        working-directory: script

      - name: Upload artifact (para deploy)
        uses: actions/upload-pages-artifact@v3
        with:
          path: script/.next

  deploy:
      runs-on: ubuntu-latest
      needs: build
      steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: script/package-lock.json

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        with:
          artifact-path: script/.next

