name: Validate Next.js app

on:
  push:
    branches: ["master", "main"]

jobs:
  validate-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: script/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: script

      - name: Run build Next.js
        run: npm run build
        working-directory: script

      - name: Wait server
        run: sleep 30

  validate-production:
    runs-on: ubuntu-latest
    needs: validate-build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: script/package-lock.json
          
      - name: Install dependencies
        run: npm ci
        working-directory: script
        
      - name: Run server Next.js
        run: npm start &
        working-directory: script

      - name: Wait server
        run: sleep 30

      - name: Validate server
        run: curl -I http://localhost:3000 | grep "200 OK" || exit 1
  


